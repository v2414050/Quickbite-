<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - QuickBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="menu-body">
    <header>
        <nav class="container" style="background-color: rgba(80, 79, 79, 0.658);">
            <a href="index.html" class="logo" style="margin-left: 20px;">
                <i class="fa-solid fa-burger"></i> QuickBite
            </a>
            <div class="btn-group">
                <button id="loginBtn" class="btn btn-primary">Login</button>
                <button id="registerBtn" class="btn btn-primary">Register</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="menu-page">
            <div class="container translucent-bg">
                <div class="section-header">
                    <a href="index.html#cafes" class="btn btn-secondary">Back to Cafeterias</a>

                    <h1 id="cafe-name-header" class="highlight-header">Brio Menu</h1>

                    <p class="menu-subtitle">Delicious offerings satisfying your cravings.</p>
                </div>

                <div class="menu-page-layout">
                    <div class="menu-grid"></div>

                    <aside class="order-summary">
                        <h2>Your Order</h2>
                        <ul id="order-items-list">
                            <li id="empty-cart-message">Your cart is empty.</li>
                        </ul>
                        <div class="order-total">
                            <strong>Total:</strong> <strong id="order-total-price">₹0.00</strong>
                        </div>
                        <button class="btn btn-primary full-width">Place Order</button>
                    </aside>
                </div>
            </div>
        </section>
    </main>

<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <div class="modal-tabs">
            <button id="customerTab" class="tab-btn active">Student</button>
            <button id="vendorTab" class="tab-btn">Vendor</button>
        </div>

        <form id="loginForm">
            <h2 id="formTitleLogin">Login</h2>

            <div id="customerLoginFields">
                <input type="email" placeholder="Student Email" required>
            </div>

            <div id="vendorLoginFields" class="hidden">
                <input type="email" placeholder="Vendor Email">
            </div>

            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
            <p class="form-switch">
                Don't have an account? <a href="#" id="showRegister">Register here</a>
            </p>
        </form>

        <form id="registerForm" class="hidden">
            <h2 id="formTitleRegister">Create Account</h2>

            <div id="customerRegisterFields">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Student Email" required>
                <input type="text" placeholder="Student ID" required>
            </div>

            <div id="vendorRegisterFields" class="hidden">
                <input type="text" placeholder="Cafeteria Name"> <input type="email" placeholder="Vendor Email"> <input
                    type="tel" placeholder="Phone Number">
            </div>

            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button type="submit" class="btn btn-primary">Register</button>
            <p class="form-switch">
                Already have an account? <a href="#" id="showLogin">Login here</a>
            </p>
        </form>
    </div>
</div>

    <script src="jss/script.js"></script>
    <script src="jss/app.js"></script>
</body>

</html>
